name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages. Nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes one still deploying; never two at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `ci` installs exactly what package-lock.json pins, unlike `install`,
      # which may resolve newer versions and make the build differ from local.
      - run: npm ci

      - run: npm run lint
      - run: npm test

      # Runs tsc before vite, so a type error fails the build rather than
      # shipping quietly — vite alone does not type check.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
